# Publishes the package to npm via Trusted Publishing (OIDC): no tokens, no
# secrets. The trusted publisher configured on npmjs.com must name this exact
# file (publish.yml), allow "npm publish", and complete its first publish
# within 2 days of being created.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for the gh release step below

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
